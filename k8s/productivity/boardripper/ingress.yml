apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: boardripper-authentik
  namespace: productivity
spec:
  forwardAuth:
    address: http://ak-outpost-proxy-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boardripper
  namespace: productivity
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: productivity-boardripper-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: boards.zefirsroyal.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
---
# Machine clients must reach OAuth discovery, registration, token exchange,
# and the bearer-authenticated MCP transport without a browser session.
# NEVER change these Exact matches to a /api/mcp Prefix: token issuance,
# pairing, settings, and /api/mcp/oauth/authorize must remain behind Authentik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boardripper-mcp
  namespace: productivity
spec:
  ingressClassName: traefik
  rules:
    - host: boards.zefirsroyal.cloud
      http:
        paths:
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /api/mcp/
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /api/mcp/oauth/register
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /api/mcp/oauth/token
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
          - path: /api/mcp/oauth/jwks
            pathType: Exact
            backend:
              service:
                name: boardripper
                port:
                  number: 8080
