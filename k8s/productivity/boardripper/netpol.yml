apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: boardripper
  namespace: productivity
spec:
  podSelector:
    matchLabels:
      app: boardripper
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: boardripper-xzz-sync
      ports:
        - port: 8080
          protocol: TCP
