apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardripper
  namespace: productivity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: boardripper
  template:
    metadata:
      labels:
        app: boardripper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-uploads
          image: busybox:1.37.0
          command: [mkdir, -p, /data/incoming]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: boardripper
          image: ghcr.io/alexeyinwerp/boardripper:v0.40.0@sha256:81dc04f543302e8f63c518b70bbd3748e5ddb25a9c3f759e8933d55687e4d388
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
            - name: LIBRARY_DIR
              value: /library
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: library
              mountPath: /library/Repair Schematics
              readOnly: true
            - name: data
              mountPath: /library/incoming
              subPath: incoming
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: boardripper-data
        - name: library
          nfs:
            server: 10.0.3.1
            path: /mnt/jabberwock/shares/global/Repair Schematics
            readOnly: true
