apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrared
  namespace: game-servers
  annotations:
    reloader.stakater.com/auto: "true"
    secrets.infisical.com/auto-reload: "true"
spec:
  selector:
    matchLabels:
      app: infrared
  template:
    metadata:
      labels:
        app: infrared
    spec:
      volumes:
        - name: global-config
          configMap:
            name: infrared-global-config
        - name: cubes-proxy-config
          configMap:
            name: infrared-cubes-proxy-config
        - name: duster-proxy-config
          configMap:
            name: infrared-duster-proxy-config
      containers:
        - name: infrared
          image: docker.io/haveachin/infrared:2.0.0-alpha.r2
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 25565
              protocol: TCP
              name: minecraft
          volumeMounts:
            - name: global-config
              mountPath: /etc/infrared/config.yml
              subPath: config.yml
              readOnly: true
            - name: cubes-proxy-config
              mountPath: /etc/infrared/proxies/cubes.yml
              subPath: cubes.yml
              readOnly: true
            - name: duster-proxy-config
              mountPath: /etc/infrared/proxies/dustmaxxing.yml
              subPath: dustmaxxing.yml
              readOnly: true
        - name: cslod-forwarder
          image: docker.io/alpine/socat:1.8.1.3@sha256:3ed1cd38741bd445ebffa3aecb9d80c46a83db45f5b5ef03332976c7ca9814af
          imagePullPolicy: IfNotPresent
          args:
            - -d
            - -d
            - -T75
            - TCP4-LISTEN:25566,reuseaddr,fork,max-children=32,backlog=64
            - TCP4-CONNECT:modded-mc.game-servers.svc.cluster.local:25566,connect-timeout=5
          ports:
            - name: cslod
              containerPort: 25566
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: cslod
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: cslod
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
