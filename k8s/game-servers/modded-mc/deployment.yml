apiVersion: apps/v1
kind: Deployment
metadata:
  name: modded-mc
  namespace: game-servers
  annotations:
    reloader.stakater.com/auto: "true"
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: modded-mc
  template:
    metadata:
      labels:
        app: modded-mc
    spec:
      terminationGracePeriodSeconds: 120
      volumes:
        - name: modded-mc-data
          persistentVolumeClaim:
            claimName: modded-mc-data-26-1-2
        - name: bluemap-config
          configMap:
            name: modded-mc-bluemap-config
        - name: servercore-config
          configMap:
            name: modded-mc-servercore-config
        - name: spark-config
          configMap:
            name: modded-mc-spark-config
        - name: distant-horizons-config
          configMap:
            name: modded-mc-distant-horizons-config
        - name: chunksmith-config
          configMap:
            name: modded-mc-chunksmith-config
        - name: background-pregen-config
          configMap:
            name: modded-mc-background-pregen
      nodeSelector:
        kubernetes.io/hostname: s7
      initContainers:
        - name: prepare-data-directories
          image: docker.io/itzg/minecraft-server:2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
          imagePullPolicy: IfNotPresent
          command:
            - mkdir
            - -p
            - /data/logs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: modded-mc-data
              mountPath: /data
      containers:
        - name: modded-mc
          image: docker.io/itzg/minecraft-server:2026.8.0-java25@sha256:e3335993929a1565f73c30b2041bcbc1473fc9c406fdd5a0d0ea24c08ef73320
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    controller=/config/background-pregen/controller.sh
                    log=/data/logs/background-pregen-controller.log
                    lock=/data/logs/background-pregen-controller.lock
                    if ! command -v flock >/dev/null 2>&1 ||
                      ! command -v gosu >/dev/null 2>&1 ||
                      ! test -r "${controller}" ||
                      ! gosu 1000:1000 test -w /data/logs ||
                      ! gosu 1000:1000 test -w /data/config/chunksmith; then
                      printf '%s [background-pregen] launcher preflight failed\n' \
                        "$(date '+%Y-%m-%dT%H:%M:%S%z')" >>"${log}" 2>&1 || true
                      exit 0
                    fi
                    nohup gosu 1000:1000 flock -n "${lock}" /bin/sh -c '
                      while :; do
                        /bin/sh /config/background-pregen/controller.sh
                        status=$?
                        if test "${status}" -eq 0; then
                          exit 0
                        fi
                        case "${status}" in
                          64|65|66)
                            printf "%s [background-pregen] permanent controller setup error %s; launcher exiting\n" \
                              "$(date "+%Y-%m-%dT%H:%M:%S%z")" "${status}"
                            exit 0
                            ;;
                        esac
                        printf "%s [background-pregen] controller exited %s; restarting in 15s\n" \
                          "$(date "+%Y-%m-%dT%H:%M:%S%z")" "${status}"
                        sleep 15
                      done
                    ' </dev/null >>"${log}" 2>&1 &
          resources:
            requests:
              memory: "20Gi"
              cpu: "4"
            limits:
              memory: "24Gi"
              cpu: "6"
          ports:
            - containerPort: 25565
              protocol: TCP
              name: minecraft
            - containerPort: 25566
              protocol: TCP
              name: cslod
            - containerPort: 8100
              protocol: TCP
              name: map
          volumeMounts:
            - name: modded-mc-data
              mountPath: /data
            - name: bluemap-config
              mountPath: /config/bluemap
              readOnly: true
            - name: servercore-config
              mountPath: /config/servercore
              readOnly: true
            - name: spark-config
              mountPath: /config/spark
              readOnly: true
            - name: distant-horizons-config
              mountPath: /config/DistantHorizons.toml
              subPath: DistantHorizons.toml
              readOnly: true
            - name: chunksmith-config
              mountPath: /config/chunksmith
              readOnly: true
            - name: background-pregen-config
              mountPath: /config/background-pregen
              readOnly: true
          startupProbe:
            exec:
              command:
                - mc-monitor
                - status
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mc-monitor
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mc-monitor
                - status
            initialDelaySeconds: 30
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          envFrom:
            - configMapRef:
                name: modded-mc-config
            - secretRef:
                name: modded-mc-secrets
        - name: mc-monitor
          image: docker.io/itzg/mc-monitor:0.17.0@sha256:0d6b89c29d93cfcfcfee7bfd8e3758ddf00e20eb157e3e9a6560a93fe7fe84d1
          imagePullPolicy: IfNotPresent
          args:
            - export-for-prometheus
          env:
            - name: EXPORT_SERVERS
              value: 127.0.0.1:25565
            - name: EXPORT_PORT
              value: "9100"
            - name: TIMEOUT
              value: 10s
          ports:
            - containerPort: 9100
              protocol: TCP
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
