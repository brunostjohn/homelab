apiVersion: batch/v1
kind: Job
metadata:
  name: palworld-empty-volume-verifier-2026-08-10
  namespace: game-servers
  labels:
    app.kubernetes.io/name: palworld-storage-verifier
    app.kubernetes.io/part-of: palworld
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: palworld-storage-verifier
        app.kubernetes.io/part-of: palworld
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: s7
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-empty
          image: rancher/mirrored-library-busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -n "$(ls -A /volume)" ]; then
                echo "ERROR: new Palworld volume is not empty" >&2
                ls -la /volume >&2
                exit 1
              fi
              echo "verified: new Palworld volume is empty"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /volume
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: palworld-data-2026-08-10
            readOnly: true
