---
apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-jabberwock-proxy
  namespace: rakazo
data:
  default.conf.template: |
    server {
      listen 8080;
      server_name _;
      access_log off;
      client_max_body_size 2m;
      location = /health {
        proxy_pass http://127.0.0.1:8081/health;
      }
      location / {
        if ($http_authorization != "Bearer ${JABBERWOCK_MCP_TOKEN}") { return 401; }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8081;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
      }
    }

    # The NAS certificate names localhost; trust its pinned public certificate.
    server {
      listen 127.0.0.1:9443;
      server_name _;
      access_log off;
      client_max_body_size 16m;
      location / {
        proxy_pass https://10.0.3.1:443;
        proxy_set_header Host localhost;
        proxy_ssl_trusted_certificate /config/nas-ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_read_timeout 300s;
      }
    }
  nas-ca.pem: |
