---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ssh-mcp-config
  namespace: rakazo
data:
  config.toml: |
    [defaults]
    defaultProfile = "kube-s3"
    # shortcut: Rakazo reviews writes; require MCP elicitation once its client supports it.
    approvalMode = "auto"
    commandTimeoutMs = 60000
    commandMaxOutputBytes = 1048576
    sessionMaxPerConnection = 3
    sessionIdleTimeoutMs = 600000
    sessionBackgroundMaxMs = 3600000

    [[profiles]]
    name = "kube-s1"
    host = "10.0.0.2"
    port = 22
    user = "brunostjohn"
    auth = "key"
    keyRef = "/runtime/keys/id_ed25519"
    trustedHostKey = "SHA256:eY6fKfsAs8i8ifYQ+sstMa73+jTCgCVygh4VLoEL8Xc"
    role = "admin"
    group = "prod"
    tty = false

    [[profiles]]
    name = "kube-s2"
    host = "10.0.3.3"
    port = 22
    user = "brunostjohn"
    auth = "key"
    keyRef = "/runtime/keys/id_ed25519"
    trustedHostKey = "SHA256:QYZLe6fpc1wcUfHW9xa7Vrr0LJGcwmcmIAsLCr5Cvt8"
    role = "admin"
    group = "prod"
    tty = false

    [[profiles]]
