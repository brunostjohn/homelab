    trustedHostKey = "SHA256:+SJv1rLJHZTIefQxJk6qzeKdNVllozGXlg4ZoCVO+9c"
    role = "admin"
    group = "prod"
    tty = false

    [[profiles]]
    name = "kube-s5"
    host = "10.0.0.8"
    port = 22
    user = "brunostjohn"
    auth = "key"
    keyRef = "/runtime/keys/id_ed25519"
    trustedHostKey = "SHA256:/9C+nXlt821v/f//eLJ6ne//kpXEFmddqn6PyTwrVKc"
