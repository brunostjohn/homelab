---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-family-proxy
  namespace: rakazo
data:
  default.conf.template: |
    server {
      listen 8080;
      server_name _;
      access_log off;
      client_max_body_size 2m;
      location = /health {
        return 200 'ok';
      }
      location / {
        if ($http_authorization != "Bearer ${MEALIE_MCP_TOKEN}") { return 401; }
        proxy_pass http://127.0.0.1:9557;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9557;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-family
  namespace: rakazo
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie-family
  template:
    metadata:
      labels:
        app: mealie-family
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: mealie-cache
        emptyDir:
          sizeLimit: 256Mi
      - name: proxy-tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: proxy-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: proxy-template
        configMap:
          name: mealie-family-proxy
      containers:
      - name: mealie
        image: ghcr.io/mdlopresti/mealie-mcp@sha256:021ea493e0c245b42910e302281c723eec9e52291ec7588108d8553df2173cca
        command:
        - python
        - "-c"
        args:
        - from src.server import mcp; mcp.run(transport="streamable-http", host="127.0.0.1",
          port=9557, stateless_http=True)
        env:
        - name: MEALIE_URL
          value: http://mealie.mealie.svc.cluster.local:9000
        - name: MEALIE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: MEALIE_FAMILY_API_TOKEN
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: mealie-cache
          mountPath: "/tmp"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 256Mi
        startupProbe:
          exec:
            command:
            - python
            - "-c"
            - import socket; socket.create_connection(('127.0.0.1',9557),2).close()
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - python
            - "-c"
            - import socket; socket.create_connection(('127.0.0.1',9557),2).close()
          periodSeconds: 20
      - name: auth-proxy
        image: nginxinc/nginx-unprivileged:1.29.3-alpine@sha256:5aea7cc516b419e3526f47dd1531be31a56a046cfe44754d94f9383e13e2ee99
        command:
        - sh
        - "-ec"
        args:
        - envsubst '${MEALIE_MCP_TOKEN}' < /config/default.conf.template > /etc/nginx/conf.d/default.conf;
          exec nginx -g 'daemon off;'
        env:
        - name: MEALIE_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: MEALIE_FAMILY_MCP_TOKEN
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: proxy-tmp
          mountPath: "/tmp"
        - name: proxy-config
          mountPath: "/etc/nginx/conf.d"
        - name: proxy-template
          mountPath: "/config"
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 10
      nodeSelector:
        kubernetes.io/arch: amd64
---
apiVersion: v1
kind: Service
metadata:
  name: mealie-family
  namespace: rakazo
spec:
  selector:
    app: mealie-family
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mealie-family
  namespace: rakazo
spec:
  podSelector:
    matchLabels:
      app: mealie-family
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - rakazo-api
          - rakazo-worker
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: mealie
      podSelector:
        matchLabels:
          app: mealie
    ports:
    - protocol: TCP
      port: 9000
