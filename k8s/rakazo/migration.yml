apiVersion: batch/v1
kind: Job
metadata:
  name: rakazo-migrate-4352edf
  namespace: rakazo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: ghcr.io/elie222/rakazo/app@sha256:b81ae4b1ba6003731489255b2c92b974ef81a99d43404b831cbbc7c8ac324236
        workingDir: "/app/apps/api"
        command:
        - node
        - "--enable-source-maps"
        - dist/cli/migrate-database.js
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: DATABASE_URL
        - name: DATABASE_MIGRATION_URL
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: DATABASE_MIGRATION_URL
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
