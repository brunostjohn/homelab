apiVersion: v1
kind: Service
metadata:
  name: rakazo-api-vm
  namespace: rakazo
spec:
  type: NodePort
  selector:
    app: rakazo-api
  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: 32100
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-computer-screens
  namespace: rakazo
spec:
  ports:
    - name: http
      port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Endpoints
metadata:
  name: rakazo-computer-screens
  namespace: rakazo
subsets:
  - addresses:
      - ip: 10.0.194.215
    ports:
      - name: http
        port: 5173
