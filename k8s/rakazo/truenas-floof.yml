---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-floof
  namespace: rakazo
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: truenas-floof
  template:
    metadata:
      labels:
        app: truenas-floof
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: mcp-cache
        emptyDir:
          sizeLimit: 256Mi
      - name: proxy-tmp
        emptyDir:
          sizeLimit: 16Mi
      - name: proxy-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: proxy-template
        configMap:
          name: truenas-floof-proxy
      containers:
      - name: mcp
        image: ghcr.io/brunostjohn/homelab-mcp:2026-11-10@sha256:0e724d85ab002368706651169ae1a81b883b91adab1202462ace0a97fc2f298f
        env:
        - name: HOME
          value: "/tmp"
        - name: TRUENAS_URL
          value: http://127.0.0.1:9443
        - name: TRUENAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: FLOOF_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: mcp-cache
          mountPath: "/tmp"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 256Mi
        startupProbe:
          exec:
            command:
            - node
            - "-e"
            - fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 12
        readinessProbe:
          exec:
            command:
            - node
            - "-e"
            - fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 2
        stdin: true
        args:
        - "--stdio"
        - truenas-mcp
        - "--outputTransport"
        - streamableHttp
        - "--host"
        - 127.0.0.1
        - "--port"
        - '8081'
        - "--healthEndpoint"
        - "/health"
        - "--healthCheck"
        - server
      - name: auth-proxy
        image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
        command:
        - sh
        - "-ec"
        args:
        - envsubst '${FLOOF_MCP_TOKEN}' < /config/default.conf.template > /etc/nginx/conf.d/default.conf;
          exec nginx -g 'daemon off;'
        env:
        - name: FLOOF_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: FLOOF_MCP_TOKEN
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: proxy-tmp
          mountPath: "/tmp"
        - name: proxy-config
          mountPath: "/etc/nginx/conf.d"
        - name: proxy-template
          mountPath: "/config"
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 10
          timeoutSeconds: 15
      nodeSelector:
        kubernetes.io/arch: amd64
  revisionHistoryLimit: 2
---
apiVersion: v1
kind: Service
metadata:
  name: truenas-floof
  namespace: rakazo
spec:
  selector:
    app: truenas-floof
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: truenas-floof
  namespace: rakazo
spec:
  podSelector:
    matchLabels:
      app: truenas-floof
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - rakazo-api
          - rakazo-worker
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.0.3.5/32
    ports:
    - protocol: TCP
      port: 443
