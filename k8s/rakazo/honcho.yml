---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  namespace: rakazo
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
        component: honcho
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      # These nodes have unresolved runtime/availability failures during rollout.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [s3, s7]
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [s4.m-nodes.zefirscloud.local, s6.m-nodes.zefirscloud.local]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: honcho
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      initContainers:
      - name: tokenizers
        image: ghcr.io/brunostjohn/rakazo-embeddings:tei-1.9.4-bge-m3-5617a9f@sha256:d70d128c827016df77f6895b0a18e727868dbd32db3e28775b890c265f88eab7
        command: ["sh", "-ec", "mkdir -p /cache/tiktoken; cp /tokenizers/* /cache/tiktoken/"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: cache
          mountPath: /cache
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: honcho-api
        image: ghcr.io/plastic-labs/honcho:v3.6.1@sha256:2ced1a958f14c128ddb05e68deb549f9281681e44595a7a3c34adebf5b432b16
        workingDir: "/app"
        command:
        - "/app/.venv/bin/fastapi"
        - run
        - "--host"
        - 0.0.0.0
        - "--port"
        - '8000'
        - src/main.py
        env:
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_DATABASE_URL
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_JWT_SECRET
        - name: LLM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: PROXY_API_KEY
        - name: HONCHO_EMBEDDING_API_KEY
          value: local-embeddings
        - name: HF_HOME
          value: "/tmp/huggingface"
        - name: TIKTOKEN_CACHE_DIR
          value: "/tmp/tiktoken"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: "/app/config.toml"
          subPath: config.toml
          readOnly: true
        - name: cache
          mountPath: "/tmp"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 30
          failureThreshold: 5
---
