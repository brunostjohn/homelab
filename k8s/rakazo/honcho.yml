        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: honcho
  namespace: rakazo
  labels:
    app: honcho-api
spec:
  selector:
    app: honcho-api
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: honcho
  namespace: rakazo
spec:
  podSelector:
    matchLabels:
      component: honcho
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - rakazo-api
          - rakazo-worker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
      podSelector:
        matchLabels:
          cnpg.io/cluster: postgres-cluster
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: rakazo-proxy
    ports:
    - protocol: TCP
      port: 8317
  - to:
    - podSelector:
        matchLabels:
          app: rakazo-embeddings
    ports:
    - protocol: TCP
      port: 8080
