      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: honcho
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      initContainers:
      - name: tokenizers
        image: ghcr.io/brunostjohn/rakazo-embeddings:tei-1.9.4-bge-m3-5617a9f@sha256:d70d128c827016df77f6895b0a18e727868dbd32db3e28775b890c265f88eab7
        command: ["sh", "-ec", "mkdir -p /cache/tiktoken; cp /tokenizers/* /cache/tiktoken/"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: cache
          mountPath: /cache
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: honcho-worker
        image: ghcr.io/plastic-labs/honcho:v3.6.1@sha256:2ced1a958f14c128ddb05e68deb549f9281681e44595a7a3c34adebf5b432b16
        workingDir: "/app"
        command:
        - "/app/.venv/bin/python"
        - "-m"
        - src.deriver
        ports:
        - name: metrics
          containerPort: 9090
        env:
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_DATABASE_URL
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_JWT_SECRET
        - name: LLM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: PROXY_API_KEY
        - name: HONCHO_EMBEDDING_API_KEY
          value: local-embeddings
        - name: HF_HOME
          value: "/tmp/huggingface"
        - name: TIKTOKEN_CACHE_DIR
          value: "/tmp/tiktoken"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
