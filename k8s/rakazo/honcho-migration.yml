---
apiVersion: batch/v1
kind: Job
metadata:
  name: honcho-migrate-v360-1024
  namespace: rakazo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        component: honcho
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: honcho
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      containers:
      - name: migrate
        image: ghcr.io/plastic-labs/honcho:v3.6.0@sha256:eb906a2d251aa48b22347e4465b40785ea7a84e2bfd1105780416bf1f0121099
        workingDir: "/app"
        command:
        - "/app/.venv/bin/python"
        - "-c"
        - |
          import os, subprocess, sys
          import psycopg
          from psycopg import sql
          subprocess.run([sys.executable, "-m", "src.migrate"], check=True)
          uri = os.environ["DB_CONNECTION_URI"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(uri) as connection:
              with connection.cursor() as cursor:
                  for table in ("documents", "message_embeddings"):
                      cursor.execute(sql.SQL("LOCK TABLE public.{} IN ACCESS EXCLUSIVE MODE").format(sql.Identifier(table)))
                      cursor.execute("SELECT format_type(atttypid, atttypmod) FROM pg_attribute WHERE attrelid=%s::regclass AND attname='embedding'", ("public." + table,))
                      dimension = cursor.fetchone()[0]
                      if dimension != "vector(1024)":
                          # Honcho v3.6.0's initial migration hardcodes 1536; never reinterpret existing vectors.
                          cursor.execute(sql.SQL("SELECT EXISTS(SELECT 1 FROM public.{})").format(sql.Identifier(table)))
                          if cursor.fetchone()[0]:
                              raise RuntimeError("Nonempty " + table + " has incompatible embedding dimensions")
                          cursor.execute(sql.SQL("ALTER TABLE public.{} ALTER COLUMN embedding TYPE vector(1024)").format(sql.Identifier(table)))
                  cursor.execute("GRANT EXECUTE ON FUNCTION public.message_text_matches(text,text,text,text,boolean) TO honcho_runtime")
                  cursor.execute("GRANT EXECUTE ON FUNCTION public.message_text_matches_page(text,text,text,text,boolean,double precision,timestamptz,bigint,integer) TO honcho_runtime")
          print("Honcho migrations, 1024-dimensional vectors and runtime function grants verified")
        env:
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_MIGRATION_URL
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: HONCHO_JWT_SECRET
        - name: LLM_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: PROXY_API_KEY
        - name: HONCHO_EMBEDDING_API_KEY
          value: local-embeddings
        - name: HF_HOME
          value: "/tmp/huggingface"
        - name: TIKTOKEN_CACHE_DIR
          value: "/tmp/tiktoken"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: "/app/config.toml"
          subPath: config.toml
          readOnly: true
        - name: cache
          mountPath: "/tmp"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
      restartPolicy: Never
