apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-api
  namespace: rakazo
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rakazo-api
  template:
    metadata:
      labels:
        app: rakazo-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: homes
        persistentVolumeClaim:
          claimName: rakazo-homes
      - name: staging
        emptyDir:
          sizeLimit: 40Gi
      initContainers:
      - name: data-init
        image: ghcr.io/elie222/rakazo/app@sha256:971d2174b857f33695c6aef8f2ff836dcaf49ad8118fe290c55072cf59221591
        command:
        - sh
        - "-ec"
        - mkdir -p /data/homes /data/home-revisions; chown 1000:1000 /data /data/homes
          /data/home-revisions
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
        volumeMounts:
        - name: homes
          mountPath: "/data"
      containers:
      - name: api
        image: ghcr.io/elie222/rakazo/app@sha256:971d2174b857f33695c6aef8f2ff836dcaf49ad8118fe290c55072cf59221591
        imagePullPolicy: IfNotPresent
        workingDir: "/app/apps/api"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - node
        - "--enable-source-maps"
        - dist/index.js
        envFrom:
        - configMapRef:
            name: rakazo
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: DATABASE_URL
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: ENCRYPTION_KEY
        - name: OBJECT_STORAGE_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: OBJECT_STORAGE_ACCESS_KEY_ID
        - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        - name: SANDBOX_SUPERVISOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: SANDBOX_SUPERVISOR_TOKEN
        - name: COMPOSIO_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: COMPOSIO_API_KEY
        - name: EMAIL_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: RESEND_API_KEY
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: BETTER_AUTH_SECRET
        - name: SCREEN_PROXY_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: SCREEN_PROXY_SECRET
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: OIDC_CLIENT_SECRET
        - name: INBOUND_EMAIL_SECRET
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: INBOUND_EMAIL_SECRET
        - name: RAKAZO_LOCAL_MODELS_API_KEY
          valueFrom:
            secretKeyRef:
              name: rakazo
              key: PROXY_API_KEY
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 45Gi
        volumeMounts:
        - name: homes
          mountPath: "/data"
        - name: staging
          mountPath: "/data/staging"
        ports:
        - name: http
          containerPort: 3100
        startupProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: "/ready"
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-api
  namespace: rakazo
spec:
  selector:
    app: rakazo-api
  ports:
  - name: http
    port: 3100
    targetPort: http
