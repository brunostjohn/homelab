# The 1 TiB iSCSI claim of the StatefulSet that kept storage on floof. The StatefulSet controller made it, so ArgoCD
# never tracked it; listing it here adopts it, and the next commit drops this file so ArgoCD prunes the claim and the
# Delete-policy volume behind it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-storage-0
  namespace: bazel-cache
  labels:
    app: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  storageClassName: floof-iscsi-csi
  volumeMode: Filesystem
  volumeName: pvc-843f54fd-3425-425d-a768-0d0dfd4fc08b
