apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage
  namespace: bazel-cache
spec:
  podSelector:
    matchLabels:
      app: storage
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: grpc
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: diagnostics
          protocol: TCP
