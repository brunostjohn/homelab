name: Build Homelab MCP Runtime

on: # yamllint disable-line rule:truthy
  push:
    paths:
      - images/homelab-mcp/**
      - .github/workflows/rebuild-homelab-mcp.yml
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: images/homelab-mcp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brunostjohn/homelab-mcp:2026-11-10
          cache-from: type=gha
          cache-to: type=gha,mode=min
