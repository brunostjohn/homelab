apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-secrets
  namespace: argocd
spec:
  destination:
    namespace: minio
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s/minio-infrastructure
    repoURL: https://github.com/brunostjohn/homelab.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
